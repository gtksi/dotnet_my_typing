name: Deploy to GitHub Pages

# Run workflow on every push to the main branch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-to-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      # builds and publishes the app
      - name: Publish .NET Project
        run: dotnet publish RomanMatrixBuilder/RomanMatrixBuilder.csproj -c Release -o release --nologo
      
      # Changes the base-tag in index.html from '/' to the subfolder string
      # The repository name needs to match your GitHub repository name exactly.
      - name: Change base-tag in index.html
        run: sed -i 's/<base href="\/" \/>/<base href="\/dotnet_my_typing\/" \/>/g' release/wwwroot/index.html
        
      # Fix Service Worker fetching wrong base URL on GitHub Pages
      - name: Fix Service Worker base URL
        run: sed -i 's/const base = "\/";/const base = "\/dotnet_my_typing\/";/g' release/wwwroot/service-worker.js

      # Add .nojekyll file to tell GitHub Pages to not treat this as a Jekyll project.
      # This allows files and folders starting with an underscore (like _framework/) to be served.
      - name: Add .nojekyll file
        run: touch release/wwwroot/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
