<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RomanMatrixBuilder</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RomanMatrixBuilder.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Diagnostic: catch ALL errors including silent ones
        window.onerror = function (msg, url, line, col, error) {
            console.error('[BLAZOR-DIAG] onerror:', msg, url, line, col, error);
            var d = document.getElementById('blazor-error-ui');
            if (d) { d.style.display = 'block'; d.textContent = 'Error: ' + msg; }
        };
        window.addEventListener('unhandledrejection', function (e) {
            console.error('[BLAZOR-DIAG] unhandledrejection:', e.reason);
        });
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"
        onerror="console.error('[BLAZOR-DIAG] Failed to load blazor.webassembly.js')"></script>
    <script>
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
            .then(function (reg) { console.log('[BLAZOR-DIAG] SW registered:', reg.scope); })
            .catch(function (err) { console.error('[BLAZOR-DIAG] SW registration failed:', err); });
    </script>
    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        window.playAudio = (type) => {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'sound-correct') {
                    // Chime
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                    oscillator.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); // C#6
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else {
                    // Dull thud
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.1);
                }
            } catch (e) { }
        };
        window.focusElement = (element) => { if (element) element.focus(); };
    </script>
</body>

</html>
